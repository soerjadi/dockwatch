<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Dockwatch Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: rgba(30, 33, 40, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f2;
            --text-secondary: #8b92a5;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h1 svg {
            color: var(--accent);
        }

        .filter-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.3);
            display: none;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 2rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .status.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .status.failed { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }
        .status.running { background: rgba(59, 130, 246, 0.1); color: var(--info); border: 1px solid rgba(59, 130, 246, 0.2); }
        .status.skipped { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }

        .image-cell {
            font-family: var(--font-mono);
            font-size: 0.875rem;
            color: #a5b4fc;
        }

        .btn {
            background: var(--card-border);
            color: var(--text-primary);
            border: 1px solid transparent;
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Modal Styles */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-backdrop.open .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .modal-body {
            flex: 1;
            padding: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .log-viewer {
            flex: 1;
            background: #000;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            overflow-y: auto;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .log-line {
            word-break: break-all;
            margin-bottom: 0.125rem;
        }

        .log-stream-stdout { color: #d1d5db; }
        .log-stream-stderr { color: #ef4444; }
        .log-system { color: #8b92a5; font-style: italic; }

        .loader {
            border: 2px solid var(--card-border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                    <line x1="6" y1="6" x2="6.01" y2="6"></line>
                    <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
                Dockwatch
            </h1>
            <div id="filterBadge" class="filter-badge">Service: <span id="filterName"></span></div>
        </header>

        <main>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Deploy History</div>
                    <div style="color: var(--text-secondary); font-size: 0.875rem;">Auto-refreshes every 10s</div>
                </div>
                
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Image</th>
                                <th>Trigger</th>
                                <th>Status</th>
                                <th>Started At</th>
                                <th>Duration</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="7" class="empty-state">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Log Modal -->
    <div id="logModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modalTitleText">Deploy Logs</span>
                    <div id="logSpinner" class="loader" style="display: none;"></div>
                </div>
                <button class="close-btn" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="logViewer" class="log-viewer">
                    <!-- Logs will be appended here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const serviceFilter = urlParams.get('service');
        
        let ws = null;
        let historyPollInterval = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            if (serviceFilter) {
                document.getElementById('filterBadge').style.display = 'inline-block';
                document.getElementById('filterName').textContent = serviceFilter;
            }
            
            fetchHistory();
            historyPollInterval = setInterval(fetchHistory, 10000);
        });

        // Fetch History
        async function fetchHistory() {
            try {
                let url = '/api/history';
                if (serviceFilter) {
                    url += '?service=' + encodeURIComponent(serviceFilter);
                }
                const response = await fetch(url);
                const data = await response.json();
                renderHistory(data.items || []);
            } catch (err) {
                console.error('Failed to fetch history:', err);
            }
        }

        // Render History Table
        function renderHistory(items) {
            const tbody = document.getElementById('historyTableBody');
            
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No deploy history found.</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(item => {
                const date = new Date(item.StartedAt).toLocaleString();
                const duration = item.DurationMs ? (item.DurationMs / 1000).toFixed(1) + 's' : '-';
                
                let actionBtn = '';
                if (item.DeployID) {
                    actionBtn = `<button class="btn" onclick="viewLogs('${item.DeployID}', '${item.Service}')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5"></polyline>
                            <line x1="12" y1="19" x2="20" y2="19"></line>
                        </svg>
                        Logs
                    </button>`;
                }

                return `
                    <tr>
                        <td style="font-weight: 500;">
                            ${item.Service}
                            ${item.Reason ? `<div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">${item.Reason}</div>` : ''}
                        </td>
                        <td class="image-cell">${item.NewImage}</td>
                        <td style="text-transform: capitalize; color: var(--text-secondary);">${item.TriggerSource}</td>
                        <td><span class="status ${item.Status ? item.Status.toLowerCase() : 'unknown'}">${item.Status || 'unknown'}</span></td>
                        <td style="color: var(--text-secondary);">${date}</td>
                        <td style="color: var(--text-secondary);">${duration}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            }).join('');
        }

        // Logs Modal
        function viewLogs(deployId, serviceName) {
            document.getElementById('modalTitleText').textContent = `Logs: ${serviceName}`;
            const logViewer = document.getElementById('logViewer');
            logViewer.innerHTML = '<div class="log-system">Connecting to log stream...</div>';
            document.getElementById('logSpinner').style.display = 'block';
            document.getElementById('logModal').classList.add('open');
            
            // Connect WebSocket
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/deploys/${deployId}/logs`;
            
            if (ws) ws.close();
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                logViewer.innerHTML += '<div class="log-system">Connected. Waiting for logs...</div>';
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === 'log' && msg.line) {
                    const div = document.createElement('div');
                    div.className = `log-line log-stream-${msg.line.Stream || 'stdout'}`;
                    div.textContent = msg.line.Text;
                    logViewer.appendChild(div);
                    // Auto-scroll to bottom
                    logViewer.scrollTop = logViewer.scrollHeight;
                } else if (msg.type === 'done') {
                    const div = document.createElement('div');
                    div.className = 'log-system';
                    div.style.marginTop = '1rem';
                    div.textContent = `Deploy finished with status: ${msg.status}`;
                    logViewer.appendChild(div);
                    document.getElementById('logSpinner').style.display = 'none';
                    logViewer.scrollTop = logViewer.scrollHeight;
                    ws.close();
                }
            };
            
            ws.onerror = (err) => {
                const div = document.createElement('div');
                div.className = 'log-line log-stream-stderr';
                div.textContent = 'WebSocket connection error.';
                logViewer.appendChild(div);
                document.getElementById('logSpinner').style.display = 'none';
            };
            
            ws.onclose = () => {
                document.getElementById('logSpinner').style.display = 'none';
            };
        }

        function closeModal() {
            document.getElementById('logModal').classList.remove('open');
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('logModal').classList.contains('open')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
